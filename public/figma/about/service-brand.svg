<svg width="600" height="380" viewBox="0 0 600 380" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="brandCardBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f1426"/>
      <stop offset="100%" stop-color="#070913"/>
    </linearGradient>
    <linearGradient id="brandAccent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2753e3"/>
      <stop offset="100%" stop-color="#6085ff"/>
    </linearGradient>
    <filter id="blueBloom" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" mode="over"/>
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="600" height="380" rx="16" fill="url(#brandCardBg)"/>
  <rect width="600" height="380" rx="16" stroke="rgba(255,255,255,0.08)" stroke-width="1.5"/>

  <!-- Atmospheric Glow -->
  <circle cx="120" cy="80" r="100" fill="#2753e3" opacity="0.2" filter="url(#blueBloom)"/>

  <!-- Brand Architecture Board Layout -->
  <!-- Top Grid Bar -->
  <g opacity="0.4" stroke="rgba(255,255,255,0.15)" stroke-dasharray="4 4">
    <line x1="40" y1="60" x2="560" y2="60"/>
    <line x1="40" y1="200" x2="560" y2="200"/>
    <line x1="220" y1="40" x2="220" y2="340"/>
  </g>

  <!-- Typography Showcase Pod -->
  <rect x="40" y="40" width="160" height="140" rx="12" fill="rgba(39,83,227,0.08)" stroke="rgba(39,83,227,0.3)"/>
  <text x="60" y="80" font-family="'Syne', sans-serif" font-weight="800" font-size="34" fill="#ffffff" letter-spacing="-1">Aa</text>
  <text x="60" y="112" font-family="'Syne', sans-serif" font-weight="700" font-size="14" fill="#6085ff">Syne Display 700</text>
  <text x="60" y="132" font-family="'Inter', sans-serif" font-size="11" fill="rgba(255,255,255,0.6)">Bespoke Font Scale</text>
  <text x="60" y="156" font-family="'Inter', sans-serif" font-size="10" fill="#2753e3">TRACKING: -0.04em</text>

  <!-- Vector Emblem Construction -->
  <g transform="translate(260, 48)">
    <rect width="130" height="130" rx="12" fill="rgba(255,255,255,0.02)" stroke="rgba(255,255,255,0.1)"/>
    <!-- Construction Circles -->
    <circle cx="65" cy="65" r="45" stroke="#2753e3" stroke-width="1.5" stroke-dasharray="3 3" opacity="0.6"/>
    <circle cx="65" cy="65" r="30" stroke="rgba(255,255,255,0.3)" stroke-width="1"/>
    <!-- Chromatic Logo Mark -->
    <path d="M65 35 C80 35 95 50 95 65 C95 80 80 95 65 95 C50 95 35 80 35 65 Z" fill="url(#brandAccent)" opacity="0.85"/>
    <path d="M65 45 C75 45 85 55 85 65 C85 75 75 85 65 85 Z" fill="#ffffff" opacity="0.9"/>
  </g>

  <!-- Color Tokens Palette -->
  <g transform="translate(420, 48)">
    <rect width="140" height="130" rx="12" fill="rgba(255,255,255,0.02)" stroke="rgba(255,255,255,0.1)"/>
    <text x="18" y="28" font-family="'Inter', sans-serif" font-size="11" font-weight="600" fill="rgba(255,255,255,0.7)">TOKEN PALETTE</text>
    <rect x="18" y="42" width="24" height="24" rx="6" fill="#2753e3"/>
    <text x="50" y="58" font-family="'Courier', monospace" font-size="10" fill="rgba(255,255,255,0.8)">#2753E3</text>
    <rect x="18" y="74" width="24" height="24" rx="6" fill="#f07108"/>
    <text x="50" y="90" font-family="'Courier', monospace" font-size="10" fill="rgba(255,255,255,0.8)">#F07108</text>
    <rect x="18" y="106" width="24" height="16" rx="4" fill="#ffffff"/>
    <text x="50" y="119" font-family="'Courier', monospace" font-size="10" fill="rgba(255,255,255,0.8)">#FFFFFF</text>
  </g>

  <!-- Bottom Brand System Preview -->
  <g transform="translate(40, 220)">
    <rect width="520" height="120" rx="12" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.08)"/>
    <rect x="20" y="24" width="70" height="70" rx="8" fill="#152865" stroke="rgba(39,83,227,0.4)"/>
    <path d="M55 45 L70 65 L40 65 Z" fill="#6085ff"/>
    <text x="110" y="48" font-family="'Syne', sans-serif" font-weight="700" font-size="17" fill="#ffffff">Comprehensive Design System</text>
    <text x="110" y="72" font-family="'Inter', sans-serif" font-size="12" fill="rgba(255,255,255,0.6)">Figma Variables · Micro-Typography · Component Sets · Vector Icons</text>
    
    <!-- Pills -->
    <rect x="110" y="88" width="75" height="20" rx="10" fill="rgba(39,83,227,0.2)"/>
    <text x="120" y="102" font-family="'Inter', sans-serif" font-size="10" fill="#6085ff" font-weight="600">TOKENS</text>

    <rect x="195" y="88" width="90" height="20" rx="10" fill="rgba(255,255,255,0.06)"/>
    <text x="205" y="102" font-family="'Inter', sans-serif" font-size="10" fill="rgba(255,255,255,0.7)" font-weight="600">GUIDELINES</text>

    <rect x="295" y="88" width="85" height="20" rx="10" fill="rgba(255,255,255,0.06)"/>
    <text x="305" y="102" font-family="'Inter', sans-serif" font-size="10" fill="rgba(255,255,255,0.7)" font-weight="600">PACKAGING</text>
  </g>
</svg>
